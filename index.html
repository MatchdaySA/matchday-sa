<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#14202b;--mu:#5d6b78;--pr:#0d47a1;--ac:#c8102e;--bd:#dde3e8;--wa:#fff4d6;--wt:#7a5600;--ok:#e3f4ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161c;--card:#18222b;--tx:#e8eef3;--mu:#94a3b0;--pr:#6aa6ff;--bd:#2b3945;--wa:#3a2f10;--wt:#f0c96a;--ok:#12301f}}
:root[data-theme="dark"]{--bg:#0f161c;--card:#18222b;--tx:#e8eef3;--mu:#94a3b0;--pr:#6aa6ff;--bd:#2b3945;--wa:#3a2f10;--wt:#f0c96a;--ok:#12301f}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:70px}
header{background:#011432;border-bottom:3px solid #f7931e;color:#fff;padding:8px 14px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:17px}header small{display:block;opacity:.85;font-size:12px}
main{padding:12px;max-width:640px;margin:auto}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
h2{font-size:17px;margin:4px 0 10px}h3{font-size:14px;margin:0 0 8px;color:var(--pr)}
.w{background:var(--wa);color:var(--wt);border-radius:8px;padding:8px 10px;font-size:13px;margin:6px 0}
.ok{background:var(--ok)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:10px 2px;font-size:11px}
nav button.on{color:var(--pr);font-weight:700}
button.b{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:9px 12px;font-size:14px}
button.g{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:8px 10px}
button:disabled{opacity:.4}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:3px 0}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--bd)}
th:first-child,td:first-child{text-align:left}.sc{overflow-x:auto}
.st{display:flex;gap:3px;margin-bottom:10px}.st i{flex:1;height:6px;border-radius:3px;background:var(--bd)}.st i.d{background:var(--pr)}
.r{display:flex;gap:8px;align-items:center;justify-content:space-between}
.n{display:inline-flex;align-items:center;gap:6px}.n button{width:30px;height:30px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
.tag{font-size:11px;padding:2px 7px;border-radius:10px;background:var(--bd);color:var(--mu)}
label.k{display:flex;gap:8px;align-items:center;padding:4px 0}label.k input{width:auto;margin:0}
.sp{display:flex;justify-content:space-around;margin:6px 0 12px}.sp div{text-align:center;font-size:12px}.sp i{display:flex;width:54px;height:54px;border-radius:50%;align-items:center;justify-content:center;font-size:26px;font-style:normal;margin:0 auto 4px;border:3px solid #fff5}
.roleGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:10px}.roleCard{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 6px;text-align:left;cursor:pointer}.roleCard b,.roleCard small,.roleCard span{display:block}.roleCard small{font-size:11px;color:var(--mu);margin:3px 0}.roleCard span{font-size:11px;color:var(--pr);font-weight:700}.roleCard.active{border:2px solid var(--pr);padding:9px 5px}.sportBtn{border:0;background:none;color:var(--tx);font:inherit;cursor:pointer;text-align:center;padding:0}.sportBtn i{display:flex;width:54px;height:54px;border-radius:50%;align-items:center;justify-content:center;font-size:26px;font-style:normal;margin:0 auto 4px;border:3px solid #fff5}.sportBtn small{display:block;color:var(--pr);font-size:10px;font-weight:700;margin-top:2px}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.tl button{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:14px;padding:16px 8px;font-size:14px}.tl span{display:block;font-size:26px;color:var(--pr)}
.topRole{border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:8px;padding:7px 9px;font-size:11px;font-weight:700;cursor:pointer}.topRole.on{background:#fff;color:#163f67;border-color:#fff}.topRole:hover{opacity:.9}
</style></head><body>

function apply(st){applying=true;try{if(st.M)M=st.M;[[RS,st.RS],[EVS,st.EVS],[CLK,st.CLK]].forEach(([o,n])=>{Object.keys(o).forEach(k=>delete o[k]);Object.assign(o,n||{})})}finally{applying=false}R(1)}
async function load(){
 if(!window.supabase){badge(0);return}
 try{c=supabase.createClient(URL,KEY);
 const[s,f]=await Promise.all([c.from('schools').select('id,name'),c.from('fixtures').select('id,home_id,away_id,created_at').order('created_at')]);
 if(s.error||f.error)throw(s.error||f.error);
 s.data.forEach(x=>{sid[x.name]=x.id;snm[x.id]=x.name});
 const f0=f.data.find(x=>x.home_id==sid[H]&&x.away_id==sid[A]);if(!f0)throw new Error('fixture not found');fid=f0.id;
 let pl=await c.from('players').select('*');if(pl.error)throw pl.error;
 if(!pl.data.length){const rows=players.map(p=>({id:uid(),school_id:sid[p.sc],surname:p.sn,name:p.nm,sport:p.sp||'rugby',age_group:p.g,dob:p.dob||null,certified:!!p.cert})).filter(r=>r.school_id);
  const ins=await c.from('players').upsert(rows,{onConflict:'school_id,surname,name,sport,age_group',ignoreDuplicates:true});if(ins.error)throw ins.error;
  pl=await c.from('players').select('*');if(pl.error)throw pl.error}
 const keep=players.filter(p=>!UU.test(p.id)).length;
 players.splice(0,players.length,...pl.data.map(r=>({id:r.id,sc:snm[r.school_id],sn:r.surname,nm:r.name,sp:r.sport,g:r.age_group,dob:r.dob||'',cl:!!r.dob,by:r.dob?'school':null,cert:r.certified})));
 const tl=await c.from('team_lists').select('id,school_id,sport,age_group,submitted,team_list_players(player_id,shirt_no)').eq('fixture_id',fid);if(tl.error)throw tl.error;
 [TL,TN,TV].forEach(o=>Object.keys(o).forEach(k=>delete o[k]));
 tl.data.forEach(t=>{const k=snm[t.school_id]+'|'+t.sport+'|'+t.age_group;TL[k]=t.team_list_players.map(x=>x.player_id);t.team_list_players.forEach(x=>TN[k+'|'+x.player_id]=x.shirt_no);if(t.submitted)TV[k]=1});
 const ms=await c.from('match_state').select('state').eq('fixture_id',fid).eq('sport','all').eq('age_group','all').maybeSingle();
 if(ms.data&&ms.data.state&&ms.data.state.M)apply(ms.data.state);
 c.channel('ms').on('postgres_changes',{event:'*',schema:'public',table:'match_state',filter:'fixture_id=eq.'+fid},p=>{const st=p.new&&p.new.state;if(st&&st.by!=cid)apply(st)}).subscribe();
 ok=true;lastP=JSON.stringify(plRows());lastT=JSON.stringify([TL,TN,TV]);badge(1);R(1)
 }catch(e){console.warn('Supabase',e);badge(0)}}
const plRows=()=>players.filter(p=>UU.test(p.id)&&sid[p.sc]).map(p=>({id:p.id,school_id:sid[p.sc],surname:p.sn,name:p.nm,sport:p.sp||'rugby',age_group:p.g,dob:p.dob||null,certified:!!p.cert}));
function touch(){if(!ok||applying||role!='school')return;clearTimeout(tm);tm=setTimeout(flush,900)}
async function flush(){if(busy){tm=setTimeout(flush,900);return}busy=true;try{
 const pr=plRows(),ps=JSON.stringify(pr);
 if(ps!=lastP&&pr.length){const r=await c.from('players').upsert(pr);if(r.error)throw r.error;lastP=ps}
 const ts=JSON.stringify([TL,TN,TV]);
 if(ts!=lastT){for(const k of Object.keys(TL)){const[sc,sp,g]=k.split('|');if(!sid[sc])continue;const ids=TL[k].filter(i=>UU.test(i)),now=new Date().toISOString();
  const r=await c.from('team_lists').upsert(Object.assign({fixture_id:fid,school_id:sid[sc],sport:sp,age_group:g,submitted:!!TV[k],updated_at:now},TV[k]?{submitted_at:now}:{}),{onConflict:'fixture_id,school_id,sport,age_group'}).select('id').single();if(r.error)throw r.error;
  const d=await c.from('team_list_players').delete().eq('team_list_id',r.data.id);if(d.error)throw d.error;
  if(ids.length){const w=await c.from('team_list_players').insert(ids.map(i=>({team_list_id:r.data.id,player_id:i,shirt_no:TN[k+'|'+i]||null})));if(w.error)throw w.error}}
  lastT=ts}
 const st=JSON.stringify({M,RS,EVS,CLK});
 if(st!=lastS){const r=await c.from('match_state').upsert({fixture_id:fid,sport:'all',age_group:'all',state:{M,RS,EVS,CLK,by:cid},updated_at:new Date().toISOString()});if(r.error)throw r.error;lastS=st}
 badge(1)}catch(e){console.warn('Supabase save',e);badge(0)}finally{busy=false}}
function evIns(k,g,side,sc,e){if(!ok||role!='school')return;e.dbid=uid();const key=sc+'|'+k+'|'+g,pid=(TL[key]||[]).find(i=>TN[key+'|'+i]==e.num);
 c.from('match_events').insert({id:e.dbid,fixture_id:fid,sport:k,age_group:g,side,event_type:String(e.type),points:Number(e.pts)||null,shirt_no:e.num?+e.num:null,player_id:UU.test(pid)?pid:null,minute:String(e.min||'')}).then(r=>{if(r.error)console.warn('event',r.error)})}
function evDel(e){if(ok&&e.dbid)c.from('match_events').delete().eq('id',e.dbid).then(()=>{})}
setTimeout(load,0);
return{uid,touch,evIns,evDel,load}})();
</script>
</body></html>
